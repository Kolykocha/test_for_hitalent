version: '3.8'

services:
  db:
    image: postgres:15
    container_name: department_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: department_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: department_app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/department_db
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DEBUG: "True"
    volumes:
      - ./:/app
    command: ["sh", "scripts/entrypoint.sh"]

volumes:
  postgres_data: